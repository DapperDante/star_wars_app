name: star_wars
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  awesome_snackbar_content: ^0.1.8
  carousel_slider: ^5.1.2
  dio: ^5.9.2
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_slidable: ^4.0.3
  font_awesome_flutter: ^11.0.0
  go_router: ^17.3.0
  intro_slider: ^4.2.5
  path_drawing: ^1.0.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"